<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="280" height="280">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1" />
      <stop offset=".5" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
    <radialGradient id="hi" cx=".28" cy=".2" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".3" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="280" height="280" fill="url(#bg)" />
  <rect width="280" height="280" fill="url(#hi)" />

  <!-- 装饰圆环 -->
  <circle cx="228" cy="58" r="34" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="2" />
  <circle cx="52" cy="228" r="20" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="2" />

  <!-- 小肥鱼 -->
  <g fill="#ffffff" opacity=".96">
    <ellipse cx="132" cy="148" rx="52" ry="36" />
    <path d="M186 148 L232 118 L232 178 Z" />
  </g>
  <!-- 鱼鳍 -->
  <path d="M126 118 q14 -22 30 -6 q-12 10 -30 6 z" fill="#ffffff" opacity=".78" />
  <!-- 眼睛 -->
  <circle cx="108" cy="138" r="7.5" fill="#4c4bd6" />
  <circle cx="105" cy="135" r="2.6" fill="#ffffff" />
  <!-- 微笑 -->
  <path d="M118 164 q14 12 28 0" stroke="#4c4bd6" stroke-width="6" stroke-linecap="round" fill="none" opacity=".85" />

  <!-- 气泡 -->
  <g fill="#ffffff" opacity=".55">
    <circle cx="196" cy="98" r="7" />
    <circle cx="216" cy="80" r="4.6" />
    <circle cx="228" cy="104" r="3.2" />
  </g>
</svg>
